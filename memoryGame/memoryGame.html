<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A card-matching memory game with tech logos. Flip cards to find all 6 matching pairs.">
    <title>Memory Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Memory Game</h1>
        <p class="score">Score: <span id="result" aria-live="polite">0</span></p>
        <div id="grid" class="grid" role="group" aria-label="Memory cards"></div>
        <div class="controls">
            <button id="restart" type="button">Restart</button>
            <a href="../index.html">Back to Games</a>
        </div>
        <div id="announcer" aria-live="assertive" class="sr-only"></div>
    </main>
    <script src="app.js"></script>
</body>
</html>
